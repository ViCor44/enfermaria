name: SAE Enfermaria CI/CD

on:
  push:
    branches: [ main ]
  pull_request:

jobs:

  php-ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_mysql, gd

      - name: Install Composer deps
        run: composer install --no-interaction --prefer-dist

      - name: PHP syntax check
        run: |
          find src -name "*.php" -exec php -l {} \;

      - name: Run PHPStan
        run: php vendor/phpstan/phpstan/phpstan analyse

      - name: Basic sanity
        run: php -r "echo 'OK';"


  deploy-internal:
    name: Deploy to internal server
    needs: php-ci
    runs-on: self-hosted

    steps:
      - name: Deploy to XAMPP folder
        run: |
          cd C:/xampp/htdocs/enfermaria
          git pull origin main

      - name: Install Composer deps
        run: |
          cd C:/xampp/htdocs/enfermaria
          composer install --no-interaction --prefer-dist

      - name: PHP lint (server)
        run: |
          cd C:/xampp/htdocs/enfermaria
          Get-ChildItem src -Recurse -Filter *.php | ForEach-Object {
            php -l $_.FullName
          }
